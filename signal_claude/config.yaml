name: "Signal HomeBot (Claude)"
description: "Private Signal bot powered by Claude Code and Home Assistant MCP"
version: "0.18.1"
slug: "signal_claude"
url: "https://github.com/misberner/signal-homebot"
arch:
  - amd64
startup: application
boot: manual
init: false
# Setup page (number, people, groups, actions) behind HA's admin login.
ingress: true
ingress_port: 8099
panel_icon: "mdi:message-lock-outline"
panel_title: "HomeBot"
# Deliberately NO host port mappings. /notify is internal to the app network.
# Options hold only secrets and connections; everything else is in the setup page.
options:
  claude_oauth_token: ""
  ha_mcp_kind: "hass"
  ha_mcp_url: "http://homeassistant:8123/api/mcp/assist"
  ha_mcp_domains: "light,climate,cover,weather"
  ha_base_url: "http://homeassistant:8123"
  ha_token: ""
  notify_token: ""
  ha_user_tokens: []
schema:
  claude_oauth_token: "password?"
  ha_mcp_kind: "list(hass|ha_mcp)"
  ha_mcp_url: "url"
  ha_mcp_domains: "match(^[a-z_]+(,[a-z_]+)*$)"
  ha_base_url: "url"
  ha_token: "password?"
  notify_token: "password?"
  ha_user_tokens:
    - user: "match(^[a-z][a-z0-9_]{0,31}$)"
      token: password
